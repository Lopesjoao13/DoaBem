# Perfil dev: banco H2 em memoria, console H2 e usuarios de demonstracao.
spring.datasource.url=jdbc:h2:mem:doabem
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Apenas desenvolvimento: nunca usar este segredo fora do perfil dev.
doabem.jwt.secret=dev-only-secret-doabem-change-me-0123456789
