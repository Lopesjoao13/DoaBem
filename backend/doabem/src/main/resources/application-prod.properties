# Perfil prod: PostgreSQL. Ainda sem instancia provisionada; todos os valores vem de var de ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true

# Flyway cria e altera o schema (db/migration). O Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# Obrigatorio, sem valor padrao (minimo 32 caracteres).
doabem.jwt.secret=${JWT_SECRET}

# Documentacao da API (Swagger): desligada por padrao; o docker compose liga por variavel de ambiente.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Usuarios de demonstracao ficam desligados por padrao; o docker compose liga com DOABEM_SEED_DEMO_USERS=true.
doabem.seed-demo-users=${DOABEM_SEED_DEMO_USERS:false}
