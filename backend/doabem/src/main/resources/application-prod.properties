# Perfil prod: PostgreSQL. Ainda sem instancia provisionada; todos os valores vem de var de ambiente.
# Exemplo: DB_URL=jdbc:postgresql://localhost:5432/doabem
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Sem Flyway por enquanto: o schema nao e alterado automaticamente em producao.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# Obrigatorio, sem valor padrao (minimo 32 caracteres).
doabem.jwt.secret=${JWT_SECRET}

# Documentacao da API (Swagger) so no perfil dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
