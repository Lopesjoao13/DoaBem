services:
  db:
    image: postgres:18
    container_name: doabem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doabem
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORTS}
    volumes:
      - doabem-data:/var/lib/postgresql
 
volumes:
  doabem-data: