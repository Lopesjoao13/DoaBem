[supervisord]
nodaemon=true
user=root

[program:postgres]
command=docker-entrypoint.sh postgres
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
command=/bin/bash -c "until pg_isready -h localhost; do sleep 2; done; exec java -jar /app/app.jar"
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true